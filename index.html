<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デイリーやまもと</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>今月の予定</h1>

  <!-- 画面切り替えボタン -->
  
<div class="menu-buttons">
  <button id="calendar-button">📅 カレンダー</button>
  <button id="todo-button">✅ ToDoリスト</button>
  <button id="worklog-button">🕒 バイト記録</button>
    <button id="savings-button">💰 貯金・目標</button>
</div>

  <!-- ==================== -->
  <!-- カレンダー画面 -->
  <!-- ==================== -->

  <div id="calendar-screen">

    <div class="calendar">

      <div class="calendar-header">

        <div class="event-form">
          <h3>予定を追加</h3>

          <input type="date" id="event-date">

          <input
            type="text"
            id="event-title"
            placeholder="予定を入力してください"
          >

          <button id="add-event">追加</button>
          <button id="add-work-button">バイトを追加</button>
        </div>

        <button id="prev">◀</button>
        <h2 id="month-year"></h2>
        <button id="next">▶</button>

      </div>

      <div class="weekdays">
        <div>日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div>土</div>
      </div>

      <div id="calendar-days" class="calendar-days"></div>

      <div class="salary-calculator">

        <h2>💰 バイト代計算</h2>

        <p>
          今月のバイト日数はカレンダーから自動で計算されます。
        </p>

        <label>
          1日の勤務時間
          <input type="number" id="hours" placeholder="例：5">
          時間
        </label>

        <label>
          時給
          <input type="number" id="wage" placeholder="例：1200">
          円
        </label>

        <button onclick="calculateSalary()">計算する</button>

        <h3 id="result">ここに給料が表示されます</h3>

      </div>

    </div>

  </div>


  <!-- ==================== -->
  <!-- ToDoリスト画面 -->
  <!-- ==================== -->

  <div id="todo-screen" style="display: none;">

    <div class="todo-container">

      <h2>✅ ToDoリスト</h2>

      <div class="todo-form">

  <input
    type="text"
    id="todo-input"
    placeholder="やることを入力してください"
  >

  <input
    type="date"
    id="todo-date"
  >

  <button id="add-todo">追加</button>

</div>

      <ul id="todo-list"></ul>

    </div>

  </div>


<!-- ==================== -->
<!-- バイト記録画面 -->
<!-- ==================== -->

<div id="worklog-screen" style="display: none;">

  <div class="todo-container">
    <h2>🕒 バイト記録</h2>

    <div class="todo-form">
      <label for="worklog-date">勤務日</label>
      <input type="date" id="worklog-date">

      <label for="worklog-start">開始時間</label>
      <input type="time" id="worklog-start" value="17:00">

      <label for="worklog-end">終了時間</label>
      <input type="time" id="worklog-end" value="22:00">

      <button id="add-worklog">勤務記録を追加</button>
    </div>

    <h3>勤務記録一覧</h3>
    <ul id="worklog-list"></ul>
    
<div class="worklog-salary">
  <h2>💰 バイト代計算</h2>

  <label for="worklog-wage">時給（円）</label>
  <input
    type="number"
    id="worklog-wage"
    placeholder="例：1200"
    value="1200"
    min="0"
  >

  <button id="calculate-worklog-salary">給料を計算する</button>

  <h3 id="worklog-salary-result">
    ここに今月の給料が表示されます
  </h3>
</div>

  </div>

</div>

  <script src="script.js"></script>

</body>
</html>
