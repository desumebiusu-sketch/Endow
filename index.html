<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endow カレンダー</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Endow カレンダー</h1>

  <div class="calendar">

    <div class="calendar-header">
      <button id="prev">◀</button>
      <h2 id="month-year"></h2>
      <button id="next">▶</button>
    </div>

    <div class="weekdays">
      <div>日</div>
      <div>月</div>
      <div>火</div>
      <div>水</div>
      <div>木</div>
      <div>金</div>
      <div>土</div>
    </div>

    <div id="calendar-days" class="calendar-days"></div>

  </div>

</body>
</html>
